# herdr configuration — see `herdr --default-config` for every option.

[ui]
agent_panel_sort = "priority"

[keys]
# tmux keeps the default ctrl+b prefix; herdr takes ctrl+a so the two nest
# without fighting over the same key.
prefix = "ctrl+a"
split_vertical = "prefix+%"
split_horizontal = 'prefix+"'
previous_agent = "prefix+comma"
next_agent = "prefix+."
focus_agent = "prefix+1..9"
switch_tab = "prefix+alt+1..9"
