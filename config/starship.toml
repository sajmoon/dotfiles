# starship.toml — managed by rcm (~/.config/starship.toml -> ~/.dotfiles/config/starship.toml)
#
# Portable across macOS and WSL/Linux. Requires a Nerd Font to be installed and
# selected in the terminal (Windows Terminal profile font / iTerm2 / etc.) so the
# glyphs below render instead of tofu boxes (▯). See README for font setup.

# Two-line prompt: info line, then the input arrow on its own line.
format = """
$directory\
$git_branch\
$git_status\
$nodejs\
$ruby\
$python\
$rust\
$golang\
$cmd_duration\
$line_break\
$character"""

add_newline = true

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold green)"

[directory]
style = "bold cyan"
read_only = " "
truncation_length = 3
truncate_to_repo = true

[git_branch]
symbol = " "
style = "bold magenta"

[git_status]
style = "bold yellow"
conflicted = "= "
ahead = "⇡${count} "
behind = "⇣${count} "
diverged = "⇕⇡${ahead_count}⇣${behind_count} "
untracked = "? "
stashed = " "
modified = "! "
staged = "+ "
renamed = "» "
deleted = "✘ "

[cmd_duration]
min_time = 2000
format = "[ $duration]($style) "
style = "yellow"

[nodejs]
symbol = " "
style = "green"

[ruby]
symbol = " "
style = "red"

[python]
symbol = " "
style = "yellow"

[rust]
symbol = " "
style = "red"

[golang]
symbol = " "
style = "cyan"
